[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigserve"
version = "0.1.0"
description = "REST API and job queue for Bayesian NMF mutational signature analysis via bayesNMF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "rq>=1.16",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
worker = [
    "rpy2>=3.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.23",
]

[tool.hatch.build.targets.wheel]
packages = ["sigserve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["sigserve"]
# Only exercised inside the R worker image, not in the unit environment.
omit = ["sigserve/rpy2_bridge.py"]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not golden'"
markers = [
    "integration: tests that require the docker-compose stack",
    "golden: sampler-accuracy tests that require R and run in the worker image",
]
