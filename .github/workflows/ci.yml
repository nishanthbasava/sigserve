name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage gate
        run: pytest --cov=sigserve --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - uses: docker/setup-buildx-action@v3

      # The R worker image is the expensive build; cache its layers between
      # runs so CI only pays full price when Dockerfile.worker changes.
      - name: Build worker image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          tags: sigserve-worker:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build api maintenance redis postgres
          docker compose up -d --no-build worker

      - name: End-to-end test against the real sampler
        run: pytest -m integration

      - name: Golden sampler-accuracy test
        run: |
          docker compose run --rm --no-deps -v ./tests:/app/tests worker \
            sh -c 'pip install -q ".[dev]" && pytest -m golden'

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs
