server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;

    # The SPA is hash-routed, so only real files and / are requested.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: strip the /api prefix. The upstream is resolved
    # per-request through Docker's DNS (via the variable) so nginx starts
    # and stays up even if the api container is restarting.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }
}
