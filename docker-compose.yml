services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn sigserve.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    command: rq worker sigserve --url redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  maintenance:
    build: .
    env_file: .env
    command: python -m sigserve.maintenance
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
