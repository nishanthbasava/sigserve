services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn sigserve.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - redis
      - postgres

  worker:
    build: .
    env_file: .env
    command: rq worker sigserve --url redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
